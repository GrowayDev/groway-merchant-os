# =============================================================================
# GitHub Actions — Auto-deploy to Netlify on push to main
# Groway Merchant OS — Designed and Built by Motheto Selepe
# =============================================================================

name: Deploy to Netlify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'build-placeholder-not-for-runtime-use' }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build
        run: bun run build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'build-placeholder-not-for-runtime-use' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://groway.netlify.app' }}

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            netlify deploy --dir=.next --build-context=deploy-preview \
              --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }}
          else
            netlify deploy --dir=.next --prod \
              --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }}
          fi
