<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:linear-gradient(135deg,#064E3B 0%,#0F766E 50%,#0D9488 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Inter','Helvetica',sans-serif; color:#F0FDF4; }
  .wordmark { font-family:'Georgia',serif; font-size:76px; font-weight:600; letter-spacing:-1px; margin-bottom:40px; }
  .lines { text-align:center; }
  .lines div { font-size:32px; line-height:1.7; font-weight:400; opacity:0.95; }
  .credit { margin-top:60px; text-align:center; }
  .credit-name { font-size:28px; font-weight:500; color:#F0FDF4; }
  .credit-label { font-size:18px; color:#A7F3D0; margin-top:8px; letter-spacing:1px; text-transform:uppercase; }
  .underline { width:200px; height:2px; background:#10B981; margin:24px auto 0; }
</style>
</head>
<body>
  <div class="wordmark">Groway Merchant OS</div>
  <div class="lines">
    <div>Traceable supply chains.</div>
    <div>Instant counterfeit detection.</div>
    <div>Regulator notification in minutes, not weeks.</div>
  </div>
  <div class="credit">
    <div class="credit-name">Designed and Built by Motheto Selepe</div>
    <div class="credit-label">Built for the township economy</div>
    <div class="underline"></div>
  </div>
</body>
</html>
