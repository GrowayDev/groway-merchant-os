<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:linear-gradient(135deg,#7C2D12 0%,#B45309 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#FFF7ED}
.card{text-align:center}

.name{font-family:'Georgia',serif;font-size:72px;font-weight:600;margin-bottom:40px}
.features{display:flex;gap:40px;justify-content:center;margin-top:30px}
.feat{text-align:center}
.feat-icon{font-size:48px;margin-bottom:12px;opacity:0.9}
.feat-label{font-size:18px;color:#FDE68A}
</style></head><body>
<div class="card">
<div class="vertical">Vertical 3 — Beauty Salon</div>
<div class="name">Glamour Hair Studio</div>
<div style="font-size:28px;opacity:0.9">A CRM that remembers every client, every visit.</div>
<div class="features">
<div class="feat"><div class="feat-icon">📅</div><div class="feat-label">Enhanced Bookings</div></div>
<div class="feat"><div class="feat-icon">💎</div><div class="feat-label">Loyalty Points</div></div>
<div class="feat"><div class="feat-icon">🌐</div><div class="feat-label">Online Widget</div></div>
<div class="feat"><div class="feat-icon">👥</div><div class="feat-label">CRM & Loyalty</div></div>
</div>
</div>
</body></html>
