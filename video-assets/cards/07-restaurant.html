<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:linear-gradient(135deg,#064E3B 0%,#0F766E 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:#F0FDF4}
.card{text-align:center}
.vertical{font-size:24px;letter-spacing:3px;color:#6EE7B7;text-transform:uppercase;margin-bottom:16px}
.name{font-family:'Georgia',serif;font-size:72px;font-weight:600;margin-bottom:40px}
.features{display:flex;gap:40px;justify-content:center;margin-top:30px}
.feat{text-align:center}
.feat-icon{font-size:48px;margin-bottom:12px;opacity:0.9}
.feat-label{font-size:18px;color:#A7F3D0}
</style></head><body>
<div class="card">
<div class="vertical">Vertical 2 — Restaurant</div>
<div class="name">The Hungry Fork</div>
<div style="font-size:28px;opacity:0.9">Same operating system, different configuration.</div>
<div class="features">
<div class="feat"><div class="feat-icon">🍽️</div><div class="feat-label">Table Floor Plan</div></div>
<div class="feat"><div class="feat-icon">👨‍🍳</div><div class="feat-label">Kitchen Display</div></div>
<div class="feat"><div class="feat-icon">📜</div><div class="feat-label">Recipe Engine</div></div>
<div class="feat"><div class="feat-icon">📱</div><div class="feat-label">QR Menu</div></div>
</div>
</div>
</body></html>
