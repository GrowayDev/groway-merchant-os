<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0B1220; display:flex; align-items:center; justify-content:center; font-family:'Georgia','Times New Roman',serif; }
  .card { text-align:center; padding:0 140px; position:relative; }
  .quote { color:#F8FAFC; font-size:46px; line-height:1.5; font-weight:400; font-style:italic; }
  .quote .num { color:#10B981; font-weight:600; font-style:normal; border-bottom:3px solid #10B981; padding-bottom:2px; }
  .attribution { color:#94A3B8; font-size:22px; margin-top:48px; font-family:'Inter',sans-serif; font-style:normal; }
</style>
</head>
<body>
  <div class="card">
    <div class="quote">"Over the last few weeks alone, food-borne illnesses have claimed the lives of at least <span class="num">22</span> of our nation's children."</div>
    <div class="attribution">— President Cyril Ramaphosa, 15 November 2024</div>
  </div>
</body>
</html>
