<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>06 · Section — SAPE</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:var(--primary);-webkit-font-smoothing:antialiased;}
  .section-title{font-family:var(--font-heading);font-weight:700;font-size:calc(var(--fs-display) * 1.15);line-height:1.1;letter-spacing:-0.02em;color:var(--white);}
  .chain-dot-w{width:10px;height:10px;border-radius:9999px;background:var(--white);box-shadow:0 0 0 4px rgba(255,255,255,0.16);flex-shrink:0;}
  .chain-line-h{height:2px;flex:1;background:rgba(255,255,255,0.32);}
</style>
</head>
<body>
<div class="slide" style="background:var(--primary);">

  <!-- decor -->
  <div class="absolute rounded-full" data-decor aria-hidden="true" style="left:-140px;top:-160px;width:420px;height:420px;background:var(--primary-dark);opacity:0.55;"></div>
  <div class="absolute rounded-full" data-decor aria-hidden="true" style="right:-120px;bottom:-180px;width:460px;height:460px;background:var(--primary-dark);opacity:0.45;"></div>
  <div class="absolute" data-decor aria-hidden="true" style="left:50%;top:47%;transform:translate(-50%,-50%);font-family:var(--font-heading);font-weight:700;font-size:300px;line-height:1;letter-spacing:0.04em;color:rgba(255,255,255,0.05);white-space:nowrap;">SAPE</div>

  <!-- content -->
  <div class="relative h-full flex flex-col items-center justify-center text-center" style="padding:0 110px;">

    <div class="flex items-center gap-5">
      <span data-decor aria-hidden="true" style="width:44px;height:2px;background:rgba(255,255,255,0.35);"></span>
      <span class="num" style="font-size:var(--fs-h3);font-weight:600;letter-spacing:0.3em;color:rgba(255,255,255,0.92);">01&nbsp;/&nbsp;02</span>
      <span data-decor aria-hidden="true" style="width:44px;height:2px;background:rgba(255,255,255,0.35);"></span>
    </div>

    <h1 class="section-title" style="margin-top:36px;">SAPE — SPZABOX Authentication<br>&amp; Provenance Engine</h1>

    <!-- chain-of-custody motif -->
    <div class="flex items-center" style="margin-top:48px;width:560px;" data-decor aria-hidden="true">
      <span class="chain-dot-w"></span>
      <span class="chain-line-h"></span>
      <span class="chain-dot-w"></span>
      <span class="chain-line-h"></span>
      <span class="chain-dot-w"></span>
      <span class="chain-line-h"></span>
      <span class="chain-dot-w"></span>
      <span class="chain-line-h"></span>
      <span class="chain-dot-w"></span>
      <span class="chain-line-h"></span>
      <span class="chain-dot-w"></span>
      <span class="chain-line-h"></span>
      <span class="chain-dot-w"></span>
    </div>

    <p style="margin-top:42px;max-width:760px;font-size:var(--fs-h3);line-height:1.65;color:rgba(255,255,255,0.88);">
      A six-layer anti-counterfeit stack built into the till, the supply chain, and the consumer&rsquo;s pocket.
    </p>

  </div>
</div>
</body>
</html>
